<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Site</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    /* Moldura azul escuro */
    body {
      background: #0a1a3a;   /* cor da moldura */
      padding: 20px;         /* espessura da moldura */
      font-family: system-ui, Arial, sans-serif;
    }

    /* Área interna do site */
    .conteudo {
      height: 100%;
      background: #ffffff;
      border-radius: 6px;
      padding: 24px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main class="conteudo">
    <h1>Olá, mundo!</h1>
    <p>Edite este arquivo para criar o seu site.</p>
  </main>
</body>
</html>
