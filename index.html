<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPC</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    /* Moldura azul escuro */
    body {
      background: #0a1a3a;   /* cor da moldura */
      padding: 20px;         /* espessura da moldura */
      font-family: system-ui, Arial, sans-serif;
    }

    /* Área interna do site */
    .conteudo {
      height: 100%;
      background: #ffffff;
      border-radius: 6px;
      padding: 24px;
      overflow: auto;
    }
  </style>
  .Button {
  display: inline-block;
  background: #0a1a3a;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 10px 20px;
  font-size: 1rem;
  text-decoration: none;
  cursor: pointer;
}

.Button:hover {
  background: #17306b;
}
</head>
<body>
  <main class="conteudo">
    <h1> LPC Scripts</h1>
    <p>Bem Vindo(a)</p>
    <Button class=button>Test</Button>
  </main>
</body>
</html>
